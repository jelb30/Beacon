# Namespace applied to all resources.
namespace: beacon-system

# Prefix added to resource names.
# Keep it aligned with the namespace prefix.
namePrefix: beacon-

# Optional labels for all resources and selectors.
#labels:
#- includeSelectors: true
#  pairs:
#    someName: someValue

resources:
- ../crd
- ../rbac
- ../manager
# [WEBHOOK] Enable all WEBHOOK blocks, including config/crd/kustomization.yaml.
#- ../webhook
# [CERTMANAGER] Enable all CERTMANAGER blocks. WEBHOOK blocks are required.
#- ../certmanager
# [METRICS] Expose the controller manager metrics service.
- metrics_service.yaml
# [NETWORK POLICY] Restrict access to metrics and webhook endpoints.
# Metrics callers need namespace label 'metrics: enabled'.
# Webhook callers need namespace label 'webhooks: enabled'.
#- ../network-policy

# Patches used by the enabled metrics setup.
patches:
# [METRICS] Serve metrics over HTTPS on :8443.
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment

# [METRICS-WITH-CERTS] Use cert-manager certificates for metrics.
#- path: cert_metrics_manager_patch.yaml
#  target:
#    kind: Deployment

# [WEBHOOK] Enable all WEBHOOK blocks, including config/crd/kustomization.yaml.
#- path: manager_webhook_patch.yaml
#  target:
#    kind: Deployment

