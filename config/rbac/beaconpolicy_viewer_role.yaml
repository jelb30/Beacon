# Helper role for users who read BeaconPolicy resources.
#
# Grants read-only access.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: beacon
    app.kubernetes.io/managed-by: kustomize
  name: beaconpolicy-viewer-role
rules:
- apiGroups:
  - autoscaling.beacon.dev
  resources:
  - beaconpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling.beacon.dev
  resources:
  - beaconpolicies/status
  verbs:
  - get
