# Helper role for users who manage StarvationEvent access.
#
# Grants full permissions on StarvationEvent resources.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: Beacon
    app.kubernetes.io/managed-by: kustomize
  name: starvationevent-admin-role
rules:
- apiGroups:
  - autoscaling.beacon.dev
  resources:
  - starvationevents
  verbs:
  - '*'
- apiGroups:
  - autoscaling.beacon.dev
  resources:
  - starvationevents/status
  verbs:
  - get
