# This rule is not used by the project Beacon itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over autoscaling.beacon.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: Beacon
    app.kubernetes.io/managed-by: kustomize
  name: starvationevent-admin-role
rules:
- apiGroups:
  - autoscaling.beacon.dev
  resources:
  - starvationevents
  verbs:
  - '*'
- apiGroups:
  - autoscaling.beacon.dev
  resources:
  - starvationevents/status
  verbs:
  - get
