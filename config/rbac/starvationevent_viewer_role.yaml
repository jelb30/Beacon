# Helper role for users who read StarvationEvent resources.
#
# Grants read-only access.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: Beacon
    app.kubernetes.io/managed-by: kustomize
  name: starvationevent-viewer-role
rules:
- apiGroups:
  - autoscaling.beacon.dev
  resources:
  - starvationevents
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling.beacon.dev
  resources:
  - starvationevents/status
  verbs:
  - get
