# This rule is not used by the project Beacon itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the autoscaling.beacon.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: Beacon
    app.kubernetes.io/managed-by: kustomize
  name: starvationevent-editor-role
rules:
- apiGroups:
  - autoscaling.beacon.dev
  resources:
  - starvationevents
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoscaling.beacon.dev
  resources:
  - starvationevents/status
  verbs:
  - get
